name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Repository variables (Settings → Secrets and variables → Actions → Variables); see src/app/site-config.ts.
          VITE_SUBSCRIBE_ENDPOINT: ${{ vars.SUBSCRIBE_ENDPOINT }}
          VITE_SUBSCRIBE_LANGUAGE_FIELD: ${{ vars.SUBSCRIBE_LANGUAGE_FIELD }}
          VITE_WHATSAPP_NUMBER: ${{ vars.WHATSAPP_NUMBER }}
          VITE_PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          VITE_GOOGLE_TAG_ID: ${{ vars.GOOGLE_TAG_ID }}
          # Production origin for canonical URLs and the sitemap, and the Vite base path (use / on berrytrace.com).
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_BASE: ${{ vars.BASE }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/analog/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
